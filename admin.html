<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TUF ADMIN | GESTÃO DE ELITE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --tuf-red: #E20613; --tuf-black: #000000; }
        body { background-color: #FFFFFF; color: var(--tuf-black); font-family: 'Inter', sans-serif; }
        
        /* Typography */
        .tuf-title { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1px; }
        
        /* UI Elements */
        .sidebar { background-color: #F4F4F4; border-right: 3px solid var(--tuf-black); }
        .tuf-input { border: 2px solid #DDD; border-radius: 4px; padding: 12px; width: 100%; font-weight: 700; transition: 0.2s; }
        .tuf-input:focus { border-color: var(--tuf-red); outline: none; background-color: #FFF; }
        
        .btn-tuf { 
            background-color: var(--tuf-red); color: white; font-weight: 900; font-style: italic;
            text-transform: uppercase; padding: 16px; border-radius: 4px; transition: 0.1s;
            border-bottom: 4px solid #8B0000;
        }
        .btn-tuf:active { transform: translateY(2px); border-bottom-width: 2px; }
        
        .tab-active { background-color: var(--tuf-black) !important; color: white !important; }
        
        .card-admin { border: 3px solid var(--tuf-black); border-radius: 0px; box-shadow: 8px 8px 0px var(--tuf-black); }
        
        #login-screen { background-color: #FFF; position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="login-screen">
        <div class="w-full max-w-sm p-8 border-4 border-black shadow-[12px_12px_0px_#000]">
            <img src="icones/tuf.png" class="h-20 mx-auto mb-8">
            <div class="space-y-4">
                <input type="text" id="admin-user" class="tuf-input uppercase" placeholder="USUÁRIO ADMIN">
                <div class="relative">
                    <input type="password" id="admin-pass" class="tuf-input" placeholder="SENHA">
                    <button onclick="togglePass('admin-pass')" class="absolute right-4 top-4"><i data-lucide="eye" class="w-4 h-4"></i></button>
                </div>
                <button onclick="authAdmin()" class="w-full btn-tuf">ENTRAR NO SISTEMA</button>
            </div>
        </div>
    </div>

    <aside class="w-72 sidebar p-6 hidden md:flex flex-col">
        <img src="icones/tuf.png" class="h-14 mb-12 mx-auto">
        <nav class="space-y-2 flex-1">
            <button onclick="mudarTab('lancar')" id="btn-lancar" class="flex items-center w-full p-4 font-black italic text-sm hover:bg-gray-200 tab-active"><i data-lucide="plus-square" class="mr-3"></i> LANÇAR VALORES</button>
            <button onclick="mudarTab('gerenciar')" id="btn-gerenciar" class="flex items-center w-full p-4 font-black italic text-sm hover:bg-gray-200"><i data-lucide="users" class="mr-3"></i> INFLUENCIADORES</button>
            <button onclick="mudarTab('criar')" id="btn-criar" class="flex items-center w-full p-4 font-black italic text-sm hover:bg-gray-200"><i data-lucide="user-plus" class="mr-3"></i> CRIAR ACESSO</button>
        </nav>
        <div onclick="mudarTab('perfil')" class="p-4 border-4 border-black cursor-pointer hover:bg-red-50 transition">
            <p class="text-[10px] font-black text-gray-400 uppercase">Administrador</p>
            <p id="admin-display" class="tuf-title text-red-600">---</p>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        
        <div id="box-lancar" class="space-y-8">
            <div class="flex justify-between items-center">
                <h1 class="text-5xl tuf-title">Lançar <span class="text-red-600">Dados</span></h1>
                <input type="date" id="data-global" class="tuf-input !w-48 !border-black">
            </div>

            <div class="card-admin p-8 bg-white">
                <label class="text-xs font-black uppercase mb-2 block">1. Selecione o Influenciador</label>
                <select id="select-influencer" class="tuf-input text-lg" onchange="carregarAcordoParaLancamento()">
                    <option value="">-- BUSCAR NA LISTA --</option>
                </select>

                <div id="area-lancamento" class="mt-8 pt-8 border-t-2 border-dashed border-gray-200 hidden">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div><label class="text-[10px] font-black uppercase">Registros</label><input type="number" id="val-reg" class="tuf-input" value="0"></div>
                        <div><label class="text-[10px] font-black uppercase">QFTD</label><input type="number" id="val-ftd" class="tuf-input" value="0" oninput="autoCPA()"></div>
                        <div><label class="text-[10px] font-black uppercase">Depósitos (R$)</label><input type="number" id="val-dep" class="tuf-input" value="0"></div>
                        <div><label class="text-[10px] font-black uppercase text-red-600">CPA (Calculado)</label><input type="number" id="val-cpa" class="tuf-input !border-red-600 text-red-600" value="0"></div>
                    </div>
                    <div class="mt-8 flex items-center justify-between bg-gray-100 p-4">
                        <p class="font-black italic text-sm">ACORDO ATIVO: <span id="label-acordo" class="text-red-600">R$ 0,00</span></p>
                        <button onclick="salvarLancamento()" class="btn-tuf px-12">LANÇAR NO PAINEL</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="box-gerenciar" class="hidden">
            <h1 class="text-5xl tuf-title mb-8">Gestão de <span class="text-red-600">Elite</span></h1>
            <div class="border-4 border-black overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-black text-white text-[10px] font-black uppercase italic">
                        <tr><th class="p-4">Influencer</th><th class="p-4">Login/E-mail</th><th class="p-4">Senha</th><th class="p-4">Acordo</th><th class="p-4">Pagamento</th><th class="p-4">Ação</th></tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>

        <div id="box-criar" class="hidden max-w-4xl">
            <h1 class="text-5xl tuf-title mb-8 text-red-600">Novo Cadastro</h1>
            <div class="card-admin p-10 space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-xs font-black uppercase">Nome do Influencer</label><input type="text" id="new-name" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase">E-mail (Login)</label><input type="email" id="new-email" class="tuf-input"></div>
                    <div class="relative"><label class="text-xs font-black uppercase">Senha</label><input type="password" id="new-pass" class="tuf-input"><button onclick="togglePass('new-pass')" class="absolute right-4 top-9"><i data-lucide="eye" class="w-4 h-4"></i></button></div>
                    <div><label class="text-xs font-black uppercase">Acordo CPA (R$)</label><input type="number" id="new-cpa" class="tuf-input" placeholder="70"></div>
                    <div><label class="text-xs font-black uppercase">Chave PIX</label><input type="text" id="new-pix" class="tuf-input"></div>
                    
                    <div class="col-span-2 grid grid-cols-2 gap-4 bg-gray-50 p-6 border-2 border-black">
                        <div>
                            <label class="text-xs font-black uppercase">Frequência de Pagamento</label>
                            <select id="pay-freq" class="tuf-input" onchange="ajustarDias()">
                                <option value="Semanal">TODA SEMANA</option>
                                <option value="Mensal">MENSAL</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-black uppercase">Dia Específico</label>
                            <select id="pay-day" class="tuf-input"></select>
                        </div>
                    </div>
                </div>
                <button onclick="salvarNovoInflu()" class="w-full btn-tuf text-xl">CADASTRAR NA TUF AGENCY</button>
            </div>
        </div>

        <div id="box-perfil" class="hidden text-center max-w-md mx-auto">
            <div class="border-8 border-black p-12 shadow-[16px_16px_0px_#E20613]">
                <h2 id="perf-nome" class="text-6xl tuf-title mb-4 italic">---</h2>
                <div class="bg-black text-white p-4 tuf-title text-xl mb-8">ADMIN MASTER</div>
                <div class="text-left space-y-4">
                    <p class="font-black border-b-2 border-black pb-2 uppercase">Influenciadores sob gestão: <span id="perf-count" class="text-red-600">0</span></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyC-0AR8LPQJpdVcYp6QY8nUQJgBGr8oOy0", authDomain: "tufagency-6902e.firebaseapp.com", databaseURL: "https://tufagency-6902e-default-rtdb.firebaseio.com", projectId: "tufagency-6902e", storageBucket: "tufagency-6902e.firebasestorage.app", messagingSenderId: "34548749822", appId: "1:34548749822:web:74676530713d232a725caf" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function authAdmin() {
            const u = document.getElementById('admin-user').value.toUpperCase().trim();
            const p = document.getElementById('admin-pass').value;
            if(p === "thaimorrowland2026") {
                sessionStorage.setItem('adminLogado', 'true'); sessionStorage.setItem('adminUser', u || "FELIPE_TUF"); location.reload();
            } else { alert("Senha incorreta!"); }
        }
        if(sessionStorage.getItem('adminLogado') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-display').innerText = sessionStorage.getItem('adminUser');
            document.getElementById('perf-nome').innerText = sessionStorage.getItem('adminUser');
        }

        document.getElementById('data-global').valueAsDate = new Date();
        let influsData = {};

        function carregarDados() {
            db.ref('usuarios').on('value', s => {
                const lista = document.getElementById('lista-corpo');
                const select = document.getElementById('select-influencer');
                lista.innerHTML = '';
                select.innerHTML = '<option value="">-- BUSCAR NA LISTA --</option>';
                let count = 0;
                
                s.forEach(u => {
                    const d = u.val();
                    influsData[u.key] = d;
                    count++;
                    
                    // Tabela Gerenciar
                    lista.innerHTML += `<tr class="border-b-2 border-black hover:bg-red-50 font-bold uppercase text-[11px]">
                        <td class="p-4 font-black text-red-600">${d.nome}</td>
                        <td class="p-4">${u.key}</td>
                        <td class="p-4 font-mono">${d.senha}</td>
                        <td class="p-4">R$ ${d.acordoCPA}</td>
                        <td class="p-4 text-[9px]">${d.pagamento}</td>
                        <td class="p-4"><button onclick="excluir('${u.key}')" class="text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                    </tr>`;
                    
                    // Select Lancar
                    select.innerHTML += `<option value="${u.key}">${d.nome.toUpperCase()}</option>`;
                });
                document.getElementById('perf-count').innerText = count;
                lucide.createIcons();
            });
        }

        let acordoSelecionado = 0;
        function carregarAcordoParaLancamento() {
            const id = document.getElementById('select-influencer').value;
            if(id) {
                acordoSelecionado = influsData[id].acordoCPA;
                document.getElementById('label-acordo').innerText = "R$ " + acordoSelecionado;
                document.getElementById('area-lancamento').classList.remove('hidden');
                document.getElementById('val-ftd').value = 0;
                document.getElementById('val-cpa').value = 0;
            } else {
                document.getElementById('area-lancamento').classList.add('hidden');
            }
        }

        function autoCPA() {
            const q = parseInt(document.getElementById('val-ftd').value) || 0;
            document.getElementById('val-cpa').value = q * acordoSelecionado;
        }

        function salvarLancamento() {
            const id = document.getElementById('select-influencer').value;
            const data = document.getElementById('data-global').value;
            if(!id || !data) return alert("Selecione tudo!");
            
            db.ref('usuarios/'+id+'/historico/'+data).set({
                registros: parseInt(document.getElementById('val-reg').value)||0,
                ftd: parseInt(document.getElementById('val-ftd').value)||0,
                depositos: parseFloat(document.getElementById('val-dep').value)||0,
                cpa: parseFloat(document.getElementById('val-cpa').value)||0
            }).then(() => { 
                alert("LANÇADO COM SUCESSO!"); 
                document.getElementById('area-lancamento').classList.add('hidden');
                document.getElementById('select-influencer').value = "";
            });
        }

        function salvarNovoInflu() {
            const email = document.getElementById('new-email').value.toLowerCase().trim().replace(/\s/g, '').replace(/\./g, '_');
            const data = {
                nome: document.getElementById('new-name').value.trim(),
                senha: document.getElementById('new-pass').value.trim(),
                acordoCPA: parseFloat(document.getElementById('new-cpa').value)||0,
                pix: document.getElementById('new-pix').value.trim(),
                pagamento: document.getElementById('pay-freq').value + " (" + document.getElementById('pay-day').value + ")"
            };
            db.ref('usuarios/'+email).set(data).then(() => { alert("CADASTRADO!"); mudarTab('gerenciar'); });
        }

        function ajustarDias() {
            const freq = document.getElementById('pay-freq').value;
            const select = document.getElementById('pay-day');
            select.innerHTML = '';
            if(freq === 'Semanal') {
                ['SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO', 'DOMINGO'].forEach(d => {
                    select.innerHTML += `<option value="${d}">${d}</option>`;
                });
            } else {
                for(let i=1; i<=31; i++) { select.innerHTML += `<option value="DIA ${i}">DIA ${i}</option>`; }
            }
        }

        function mudarTab(tab) {
            const boxes = ['lancar', 'gerenciar', 'criar', 'perfil'];
            boxes.forEach(b => document.getElementById('box-'+b).classList.add('hidden'));
            document.getElementById('box-'+tab).classList.remove('hidden');
            
            const btns = ['lancar', 'gerenciar', 'criar'];
            btns.forEach(b => document.getElementById('btn-'+b).classList.remove('tab-active'));
            if(tab !== 'perfil') document.getElementById('btn-'+tab).classList.add('tab-active');
        }

        function togglePass(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
        function excluir(id) { if(confirm("EXCLUIR INFLUENCER?")) db.ref('usuarios/'+id).remove(); }
        
        ajustarDias();
        carregarDados();
        lucide.createIcons();
    </script>
</body>
</html>
