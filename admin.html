<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TUF ADMIN | GESTÃO DE ELITE v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --tuf-red: #E20613; --tuf-black: #000000; }
        body { background-color: #FFFFFF; color: var(--tuf-black); font-family: 'Inter', sans-serif; letter-spacing: -0.5px; }
        .tuf-title { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -1.5px; }
        .sidebar { background-color: #F8F8F8; border-right: 4px solid var(--tuf-black); }
        .tuf-input { border: 3px solid var(--tuf-black); border-radius: 0px; padding: 12px; width: 100%; font-weight: 900; text-transform: uppercase; }
        .tuf-input:focus { background-color: #FFF; outline: none; box-shadow: 6px 6px 0px var(--tuf-red); }
        .btn-tuf { 
            background-color: var(--tuf-red); color: white; font-weight: 900; font-style: italic;
            text-transform: uppercase; padding: 18px; border-radius: 0px; transition: 0.1s;
            border: 3px solid var(--tuf-black); box-shadow: 4px 4px 0px var(--tuf-black);
        }
        .btn-tuf:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--tuf-black); }
        .tab-active { background-color: var(--tuf-red) !important; color: white !important; border-left: 8px solid var(--tuf-black); }
        .card-admin { border: 4px solid var(--tuf-black); border-radius: 0px; box-shadow: 10px 10px 0px var(--tuf-black); }
        .avatar-block { width: 50px; height: 50px; background-color: var(--tuf-red); display: flex; align-items: center; justify-content: center; font-weight: 900; font-style: italic; color: white; border: 3px solid var(--tuf-black); box-shadow: 3px 3px 0px var(--tuf-black); }
        #login-screen { background-color: #FFF; position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="login-screen">
        <div class="w-full max-w-sm p-10 border-[6px] border-black shadow-[15px_15px_0px_#E20613]">
            <img src="icones/tuf.png" class="h-24 mx-auto mb-8">
            <div class="space-y-4">
                <input type="text" id="admin-user" class="tuf-input" placeholder="USUÁRIO">
                <input type="password" id="admin-pass" class="tuf-input" placeholder="SENHA">
                <button onclick="authAdmin()" class="w-full btn-tuf">ACESSAR TUF</button>
            </div>
        </div>
    </div>

    <aside class="w-80 sidebar p-6 hidden md:flex flex-col">
        <img src="icones/tuf.png" class="h-14 mb-10 mx-auto">
        <nav class="space-y-2 flex-1 overflow-y-auto">
            <button onclick="mudarTab('lancar')" id="btn-lancar" class="flex items-center w-full p-4 font-black italic text-xs tab-active uppercase"><i data-lucide="plus-circle" class="mr-3"></i> LANÇAR VALORES</button>
            <button onclick="mudarTab('historico')" id="btn-historico" class="flex items-center w-full p-4 font-black italic text-xs hover:bg-gray-200 transition uppercase"><i data-lucide="history" class="mr-3"></i> HISTÓRICO GERAL</button>
            <button onclick="mudarTab('gerenciar')" id="btn-gerenciar" class="flex items-center w-full p-4 font-black italic text-xs hover:bg-gray-200 transition uppercase"><i data-lucide="users" class="mr-3"></i> GESTÃO INFLUENCERS</button>
            <button onclick="mudarTab('criar')" id="btn-criar" class="flex items-center w-full p-4 font-black italic text-xs hover:bg-gray-200 transition uppercase"><i data-lucide="user-plus" class="mr-3"></i> CRIAR ACESSO</button>
        </nav>
        <div onclick="mudarTab('perfil')" class="p-4 border-4 border-black cursor-pointer hover:bg-gray-100 mt-4 flex items-center gap-4">
            <div class="avatar-block" id="side-avatar">?</div>
            <div><p id="admin-display" class="tuf-title text-red-600">---</p><p class="text-[9px] font-black uppercase text-gray-400 italic">ADMIN MASTER</p></div>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div id="box-lancar" class="space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-5xl tuf-title">LANÇAR <span class="text-red-600">VALORES</span></h1>
                <input type="date" id="data-global" class="tuf-input !w-48">
            </div>
            <div class="card-admin p-8 bg-white">
                <label class="text-xs font-black uppercase mb-2 block italic">1. SELECIONAR INFLUENCER</label>
                <select id="select-influencer" class="tuf-input text-lg h-16" onchange="carregarAcordoParaLancamento()">
                    <option value="">-- SELECIONE --</option>
                </select>

                <div id="area-lancamento" class="mt-8 pt-8 border-t-4 border-black hidden">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                        <div><label class="text-[10px] font-black uppercase">Registros</label><input type="number" id="val-reg" class="tuf-input"></div>
                        <div><label class="text-[10px] font-black uppercase">QFTD (Conversão CPA)</label><input type="number" id="val-qftd" class="tuf-input" oninput="autoCalculo()"></div>
                        <div><label class="text-[10px] font-black uppercase">FTDs Brutos (Total)</label><input type="number" id="val-ftd" class="tuf-input"></div>
                        
                        <div class="bg-gray-100 p-4 border-2 border-black">
                            <label class="text-[10px] font-black uppercase text-red-600 italic">Receita QFTDs (Auto)</label>
                            <input type="number" id="val-dep-qftd" class="tuf-input !border-red-600" readonly>
                        </div>
                        <div class="bg-gray-100 p-4 border-2 border-black">
                            <label class="text-[10px] font-black uppercase text-red-600 italic">CPA Gerado (Auto)</label>
                            <input type="number" id="val-cpa" class="tuf-input !border-red-600" readonly>
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase">Receita FTDs Brutos (Manual)</label>
                            <input type="number" id="val-dep-bruto" class="tuf-input" placeholder="R$ 0,00">
                        </div>
                    </div>
                    <div class="mt-8 flex items-center justify-between bg-black p-6">
                        <div class="text-white text-sm font-black italic uppercase">
                            BASE: <span id="label-base" class="text-red-600">0</span> | CPA: <span id="label-cpa" class="text-red-600">0</span>
                        </div>
                        <button onclick="salvarLancamento()" class="btn-tuf px-12">LANÇAR NO PAINEL</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="box-historico" class="hidden space-y-6">
            <h1 class="text-5xl tuf-title">HISTÓRICO <span class="text-red-600">GERAL</span></h1>
            <div class="card-admin overflow-hidden">
                <table class="w-full text-left font-black uppercase italic text-[10px]">
                    <thead class="bg-black text-white">
                        <tr><th class="p-4">DATA</th><th class="p-4">INFLUENCER</th><th class="p-4 text-red-600">QFTD</th><th class="p-4">FTD</th><th class="p-4">RECEITA</th><th class="p-4 text-red-600">CPA</th></tr>
                    </thead>
                    <tbody id="lista-historico-corpo"></tbody>
                </table>
            </div>
        </div>

        <div id="box-gerenciar" class="hidden">
            <h1 class="text-5xl tuf-title mb-8">GESTÃO <span class="text-red-600">INFLU</span></h1>
            <div class="card-admin overflow-hidden">
                <table class="w-full text-left font-black uppercase italic text-[10px]">
                    <thead class="bg-black text-white">
                        <tr><th class="p-4">NOME</th><th class="p-4">LOGIN</th><th class="p-4">SENHA</th><th class="p-4">ACORDO</th><th class="p-4">PAGAMENTO</th><th class="p-4">AÇÃO</th></tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>

        <div id="box-criar" class="hidden max-w-4xl">
            <h1 class="text-5xl tuf-title mb-8 text-red-600">NOVO ACESSO</h1>
            <div class="card-admin p-10 space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div><label class="text-xs font-black uppercase italic">Nome Influencer</label><input type="text" id="new-name" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase italic">E-mail (Login)</label><input type="email" id="new-email" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase italic">Senha</label><input type="text" id="new-pass" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase italic text-red-600">Base Depósito (Ex: 25)</label><input type="number" id="new-base" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase italic text-red-600">CPA (Ex: 70)</label><input type="number" id="new-cpa" class="tuf-input"></div>
                    <div><label class="text-xs font-black uppercase italic">Chave PIX</label><input type="text" id="new-pix" class="tuf-input"></div>
                    <div class="col-span-2 grid grid-cols-2 gap-4 bg-gray-50 p-4 border-2 border-black">
                        <div><label class="text-xs font-black italic">FREQUÊNCIA</label><select id="pay-freq" class="tuf-input" onchange="ajustarDias()"><option value="Semanal">SEMANAL</option><option value="Mensal">MENSAL</option></select></div>
                        <div><label class="text-xs font-black italic">DIA</label><select id="pay-day" class="tuf-input"></select></div>
                    </div>
                </div>
                <button onclick="salvarNovoInflu()" class="w-full btn-tuf">CADASTRAR NA TUF AGENCY</button>
            </div>
        </div>

        <div id="box-perfil" class="hidden text-center max-w-sm mx-auto">
            <div class="border-[10px] border-black p-10 shadow-[15px_15px_0px_#E20613]">
                <div class="w-24 h-24 bg-red-600 border-4 border-black mx-auto mb-6 flex items-center justify-center text-white text-5xl font-black italic" id="prof-avatar">?</div>
                <h2 id="perf-nome" class="text-4xl tuf-title mb-4">---</h2>
                <div class="bg-black text-white p-3 tuf-title text-sm italic mb-6">ADMIN MASTER</div>
                <p class="font-black italic uppercase">Gestão: <span id="perf-count" class="text-red-600">0</span> Ativos</p>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyC-0AR8LPQJpdVcYp6QY8nUQJgBGr8oOy0", authDomain: "tufagency-6902e.firebaseapp.com", databaseURL: "https://tufagency-6902e-default-rtdb.firebaseio.com", projectId: "tufagency-6902e", storageBucket: "tufagency-6902e.firebasestorage.app", messagingSenderId: "34548749822", appId: "1:34548749822:web:74676530713d232a725caf" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function authAdmin() {
            const p = document.getElementById('admin-pass').value;
            const u = document.getElementById('admin-user').value.toUpperCase().trim();
            if(p === "thaimorrowland2026") {
                sessionStorage.setItem('adminLogado', 'true'); sessionStorage.setItem('adminUser', u || "FELIPE_TUF"); location.reload();
            } else { alert("SENHA INCORRETA!"); }
        }

        const currentAdmin = sessionStorage.getItem('adminUser') || "FELIPE_TUF";
        if(sessionStorage.getItem('adminLogado') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-display').innerText = currentAdmin;
            document.getElementById('perf-nome').innerText = currentAdmin;
            document.getElementById('side-avatar').innerText = currentAdmin.charAt(0);
            document.getElementById('prof-avatar').innerText = currentAdmin.charAt(0);
        }

        document.getElementById('data-global').valueAsDate = new Date();
        let influsData = {};

        function carregarDados() {
            db.ref('usuarios').on('value', s => {
                const lista = document.getElementById('lista-corpo');
                const select = document.getElementById('select-influencer');
                const histCorpo = document.getElementById('lista-historico-corpo');
                lista.innerHTML = '';
                histCorpo.innerHTML = '';
                select.innerHTML = '<option value="">-- SELECIONE --</option>';
                let count = 0;
                
                s.forEach(u => {
                    const d = u.val();
                    influsData[u.key] = d;
                    count++;
                    lista.innerHTML += `<tr class="border-b-4 border-black hover:bg-gray-100"><td class="p-4 font-black text-red-600">${d.nome}</td><td class="p-4 font-black">${u.key}</td><td class="p-4 font-mono">${d.senha}</td><td class="p-4">B:${d.base}/C:${d.acordoCPA}</td><td class="p-4">${d.pagamento}</td><td class="p-4"><button onclick="excluir('${u.key}')" class="text-red-600"><i data-lucide="trash-2"></i></button></td></tr>`;
                    select.innerHTML += `<option value="${u.key}">${d.nome.toUpperCase()}</option>`;

                    if(d.historico) {
                        Object.keys(d.historico).forEach(data => {
                            const h = d.historico[data];
                            histCorpo.innerHTML += `<tr class="border-b-2 border-black">
                                <td class="p-3">${data.split('-').reverse().join('/')}</td>
                                <td class="p-3 font-black text-red-600">${d.nome}</td>
                                <td class="p-3 font-black">${h.qftd || 0}</td>
                                <td class="p-3">${h.ftd || 0}</td>
                                <td class="p-3">R$ ${(parseFloat(h.depositos_qftd||0) + parseFloat(h.depositos_brutos||0)).toFixed(2)}</td>
                                <td class="p-3 font-black text-red-600">R$ ${parseFloat(h.cpa||0).toFixed(2)}</td>
                            </tr>`;
                        });
                    }
                });
                document.getElementById('perf-count').innerText = count;
                lucide.createIcons();
            });
        }

        let acBase = 0, acCPA = 0;
        function carregarAcordoParaLancamento() {
            const id = document.getElementById('select-influencer').value;
            if(id) {
                acBase = influsData[id].base || 0;
                acCPA = influsData[id].acordoCPA || 0;
                document.getElementById('label-base').innerText = acBase;
                document.getElementById('label-cpa').innerText = acCPA;
                document.getElementById('area-lancamento').classList.remove('hidden');
            } else { document.getElementById('area-lancamento').classList.add('hidden'); }
        }

        function autoCalculo() {
            const q = parseInt(document.getElementById('val-qftd').value) || 0;
            document.getElementById('val-dep-qftd').value = (q * acBase).toFixed(2);
            document.getElementById('val-cpa').value = (q * acCPA).toFixed(2);
        }

        function salvarLancamento() {
            const id = document.getElementById('select-influencer').value;
            const data = document.getElementById('data-global').value;
            db.ref('usuarios/'+id+'/historico/'+data).set({
                registros: parseInt(document.getElementById('val-reg').value)||0,
                qftd: parseInt(document.getElementById('val-qftd').value)||0,
                ftd: parseInt(document.getElementById('val-ftd').value)||0,
                depositos_qftd: parseFloat(document.getElementById('val-dep-qftd').value)||0,
                depositos_brutos: parseFloat(document.getElementById('val-dep-bruto').value)||0,
                cpa: parseFloat(document.getElementById('val-cpa').value)||0
            }).then(() => { alert("LANÇADO!"); location.reload(); });
        }

        // --- COPIE DAQUI PARA BAIXO E SUBSTITUA NO SEU ADMIN.HTML ---

function salvarNovoInflu() {
    const emailRaw = document.getElementById('new-email').value.trim();
    if(!emailRaw) return alert("ERRO: O E-mail é obrigatório para o login!");
    
    // Converte o e-mail para um formato que o Firebase aceite (chave do banco)
    const key = emailRaw.toLowerCase().replace(/\./g, '_').replace(/@/g, '_at_');
    
    const data = {
        nome: document.getElementById('new-name').value.trim() || emailRaw,
        senha: document.getElementById('new-pass').value.trim() || "123",
        base: parseFloat(document.getElementById('new-base').value) || 0,
        acordoCPA: parseFloat(document.getElementById('new-cpa').value) || 0,
        pix: document.getElementById('new-pix').value.trim() || "NÃO INFORMADO",
        pagamento: document.getElementById('pay-freq').value + " (" + document.getElementById('pay-day').value + ")",
        dataInicio: "01/02/2026",
        dataFim: "28/02/2026"
    };

    // Salva no Firebase
    db.ref('usuarios/' + key).set(data).then(() => {
        alert("✅ CADASTRADO COM SUCESSO!");
        document.getElementById('new-email').value = "";
        document.getElementById('new-pass').value = "";
        mudarTab('gerenciar');
    }).catch(e => alert("Erro ao salvar: " + e.message));
}

function carregarDados() {
    db.ref('usuarios').on('value', s => {
        const lista = document.getElementById('lista-corpo');
        const select = document.getElementById('select-influencer');
        const histCorpo = document.getElementById('lista-historico-corpo');
        
        if(lista) lista.innerHTML = '';
        if(histCorpo) histCorpo.innerHTML = '';
        if(select) select.innerHTML = '<option value="">-- SELECIONE --</option>';
        
        influsData = {};
        let count = 0;

        if(!s.exists()) {
            if(document.getElementById('perf-count')) document.getElementById('perf-count').innerText = 0;
            return;
        }

        s.forEach(u => {
            const d = u.val() || {};
            const key = u.key;
            influsData[key] = d;
            count++;
            
            const nomeInflu = d.nome || key;

            if(lista) {
                lista.innerHTML += `<tr class="border-b-4 border-black font-black uppercase text-[10px] text-black">
                    <td class="p-4 text-red-600">${nomeInflu}</td>
                    <td class="p-4">${key}</td>
                    <td class="p-4">${d.senha || '---'}</td>
                    <td class="p-4">B:${d.base || 0}/C:${d.acordoCPA || 0}</td>
                    <td class="p-4"><button onclick="excluir('${key}')">🗑️</button></td>
                </tr>`;
            }
            if(select) select.innerHTML += `<option value="${key}">${nomeInflu.toUpperCase()}</option>`;

            if(d.historico && histCorpo) {
                Object.keys(d.historico).forEach(dt => {
                    const h = d.historico[dt] || {};
                    const totalRec = (parseFloat(h.depositos_qftd||0) + parseFloat(h.depositos_brutos||0)).toFixed(2);
                    histCorpo.innerHTML += `<tr class="border-b-2 border-black text-black">
                        <td class="p-3">${dt}</td>
                        <td class="p-3 text-red-600">${nomeInflu}</td>
                        <td class="p-3">${h.qftd || 0}</td>
                        <td class="p-3">${h.ftd || 0}</td>
                        <td class="p-3">R$ ${totalRec}</td>
                        <td class="p-3 text-red-600">R$ ${parseFloat(h.cpa||0).toFixed(2)}</td>
                    </tr>`;
                });
            }
        });
        if(document.getElementById('perf-count')) document.getElementById('perf-count').innerText = count;
        if(typeof lucide !== 'undefined') lucide.createIcons();
    });
}

        function ajustarDias() {
            const freq = document.getElementById('pay-freq').value;
            const select = document.getElementById('pay-day');
            select.innerHTML = '';
            if(freq === 'Semanal') {
                ['SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO', 'DOMINGO'].forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
            } else {
                for(let i=1; i<=31; i++) { select.innerHTML += `<option value="DIA ${i}">DIA ${i}</option>`; }
            }
        }

        function mudarTab(tab) {
            ['lancar', 'historico', 'gerenciar', 'criar', 'perfil'].forEach(b => document.getElementById('box-'+b).classList.add('hidden'));
            document.getElementById('box-'+tab).classList.remove('hidden');
            ['lancar', 'historico', 'gerenciar', 'criar'].forEach(b => document.getElementById('btn-'+b).classList.remove('tab-active'));
            if(tab !== 'perfil') document.getElementById('btn-'+tab).classList.add('tab-active');
            lucide.createIcons();
        }

        function excluir(id) { if(confirm("APAGAR?")) db.ref('usuarios/'+id).remove(); }
        ajustarDias();
        carregarDados();
        lucide.createIcons();
    </script>
</body>
</html>
