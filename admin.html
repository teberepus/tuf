<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TUF Agency - Admin Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #1a2235; border-right: 1px solid #2d3748; }
        input, select { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; width: 100%; color: white; margin-bottom: 15px; outline: none; }
        .badge { background: #a3e635; color: #0f172a; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        #login-admin-screen { background-color: #0f172a; position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="flex min-h-screen">
    <div id="login-admin-screen">
        <div class="w-full max-w-sm p-8 bg-[#1a2235] rounded-3xl border border-slate-700">
            <h1 class="text-2xl font-black italic text-center mb-8">TUF<span class="text-blue-500">ADMIN</span></h1>
            <input type="password" id="admin-pass-input" placeholder="Senha Mestre" class="text-center">
            <button onclick="verificarSenha()" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase text-xs">Entrar</button>
        </div>
    </div>

    <aside class="w-64 sidebar p-6 hidden md:flex flex-col">
        <h1 class="text-xl font-black italic mb-10 text-blue-500">TUF AGENCY</h1>
        <nav class="space-y-2">
            <button onclick="mudarTab('lancar')" class="flex items-center w-full text-blue-400 p-3 rounded-lg bg-slate-800/50 border-l-4 border-blue-500 font-bold text-sm">Lançamentos</button>
            <button onclick="mudarTab('criar')" class="flex items-center w-full text-slate-400 p-3 rounded-lg hover:text-white font-bold text-sm">Criar Login</button>
        </nav>
    </aside>

    <main class="flex-1 p-10">
        <div id="box-lancar">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold uppercase">Gerenciamento TUF</h2>
                <input type="date" id="data-global" class="!mb-0 !p-2 !w-40 text-xs">
            </div>
            <div class="bg-slate-800/20 rounded-2xl border border-slate-700 overflow-hidden mb-10">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-800 text-slate-400"><tr><th class="p-4">Influencer</th><th class="p-4">Senha</th><th class="p-4 text-right">Ação</th></tr></thead>
                    <tbody id="tabela-influencers"></tbody>
                </table>
            </div>
            <div id="form-edicao" class="hidden bg-slate-800/40 border border-blue-500/30 p-8 rounded-2xl">
                <h3 class="text-lg font-bold mb-6">Lançar para: <span id="user-selecionado" class="text-blue-400 uppercase"></span></h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div><label class="text-[10px] text-slate-500 font-bold">REGISTROS</label><input type="number" id="edit-reg" value="0"></div>
                    <div><label class="text-[10px] text-slate-500 font-bold">FTDs</label><input type="number" id="edit-ftd" value="0"></div>
                    <div><label class="text-[10px] text-slate-500 font-bold">DEPÓSITOS</label><input type="number" id="edit-dep" value="0"></div>
                    <div><label class="text-[10px] text-slate-500 font-bold">CPA</label><input type="number" id="edit-cpa" value="0"></div>
                </div>
                <button onclick="salvarHistorico()" class="w-full bg-green-600 p-4 rounded-xl font-bold uppercase mt-4">Salvar Dados</button>
            </div>
        </div>
        <div id="box-criar" class="hidden max-w-xl">
            <h2 class="text-2xl font-bold mb-6">Novo Influencer</h2>
            <input type="text" id="new-user" placeholder="Login">
            <input type="password" id="new-pass" placeholder="Senha">
            <button onclick="criarUsuario()" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase mt-4">Criar</button>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyC-0AR8LPQJpdVcYp6QY8nUQJgBGr8oOy0", authDomain: "tufagency-6902e.firebaseapp.com", databaseURL: "https://tufagency-6902e-default-rtdb.firebaseio.com", projectId: "tufagency-6902e", storageBucket: "tufagency-6902e.firebasestorage.app", messagingSenderId: "34548749822", appId: "1:34548749822:web:74676530713d232a725caf" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        if(sessionStorage.getItem('adminLogado') === 'true') document.getElementById('login-admin-screen').style.display = 'none';
        function verificarSenha() { if(document.getElementById('admin-pass-input').value === "thaimorrowland2026") { sessionStorage.setItem('adminLogado', 'true'); location.reload(); } }

        document.getElementById('data-global').valueAsDate = new Date();
        function carregar() {
            db.ref('usuarios').once('value', s => {
                const t = document.getElementById('tabela-influencers'); t.innerHTML = '';
                s.forEach(u => {
                    t.innerHTML += `<tr onclick="abrirEdicao('${u.key}')" class="border-t border-slate-700 hover:bg-slate-700/30 cursor-pointer">
                        <td class="p-4 font-bold text-blue-400 uppercase">${u.key}</td><td class="p-4 text-slate-400">${u.val().senha}</td>
                        <td class="p-4 text-right"><button onclick="event.stopPropagation(); excluir('${u.key}')" class="text-red-500">Excluir</button></td></tr>`;
                });
            });
        }
        let sel = "";
        function abrirEdicao(u) { sel = u; document.getElementById('user-selecionado').innerText = u; document.getElementById('form-edicao').classList.remove('hidden'); }
        function salvarHistorico() {
            const d = document.getElementById('data-global').value;
            db.ref('usuarios/'+sel+'/historico/'+d).set({
                registros: parseInt(document.getElementById('edit-reg').value)||0,
                ftd: parseInt(document.getElementById('edit-ftd').value)||0,
                depositos: parseFloat(document.getElementById('edit-dep').value)||0,
                cpa: parseFloat(document.getElementById('edit-cpa').value)||0
            }).then(() => { alert("Salvo!"); document.getElementById('form-edicao').classList.add('hidden'); });
        }
        function criarUsuario() {
            const u = document.getElementById('new-user').value.toLowerCase().trim();
            const p = document.getElementById('new-pass').value;
            db.ref('usuarios/'+u).set({ senha: p, dataInicio: "01/01/2026", dataFim: "31/12/2026" }).then(() => location.reload());
        }
        function mudarTab(tab) { document.getElementById('box-lancar').classList.toggle('hidden', tab !== 'lancar'); document.getElementById('box-criar').classList.toggle('hidden', tab !== 'criar'); }
        carregar();
    </script>
</body>
</html>
